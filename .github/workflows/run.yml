name: 墨水屏综合看板推送

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 全局启用Node24，消除警告
on:
  schedule:
    - cron: '0 1-10 * * *'   # 保留，做兜底
  workflow_dispatch:          # 允许外部 API 触发
    inputs:
      reason:
        description: 'Trigger reason'
        required: false
        default: 'external cron'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送 keepalive 提交
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，以便后续提交

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install requests pillow zhdate lunar-python

      - name: 运行！生成图片并推送
        env:
          ZECTRIX_API_KEY: ${{ secrets.ZECTRIX_API_KEY }}
          ZECTRIX_MAC: ${{ secrets.ZECTRIX_MAC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMAP_WEATHER_KEY: ${{ secrets.AMAP_WEATHER_KEY }}
        run: python main.py

      - name: 保活提交（防止 60 天无活动定时任务被禁用）
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LAST_MSG=$(git log -1 --format=%s)
          if [[ "$LAST_MSG" == keepalive* ]]; then
            echo "今日已保活，跳过提交"
          else
            git commit --allow-empty -m "keepalive [skip ci] $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
